# Alur deploy utama proyek ini sekarang cPanel Node.js App (Passenger) + MariaDB milik
# hosting kampus, lihat CLAUDE.md/plan untuk langkahnya. File ini disiapkan sebagai jalur
# alternatif kalau nanti tersedia VPS dengan akses Docker.
#
# Kalau VPS itu sudah punya instance MySQL/MariaDB bersama: hapus service `db` di bawah,
# hapus `depends_on`, dan hapus override DATABASE_URL di `environment:` (biarkan nilai
# dari .env lewat `env_file:` dipakai, arahkan ke instance yang sudah ada).
services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://daftar_hadir:${DB_PASSWORD:-daftar_hadir}@db:3306/daftar_hadir
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_USER: daftar_hadir
      MARIADB_PASSWORD: ${DB_PASSWORD:-daftar_hadir}
      MARIADB_DATABASE: daftar_hadir
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
